[package]
name = "fluree-db-python"
version.workspace = true
edition.workspace = true
# The repository's LICENSE, which maturin puts in the wheel; the license
# expression (BUSL-1.1) comes from pyproject.toml.
license-file = "../LICENSE"
repository.workspace = true
description = "Native core of the `fluree` Python package"
# Distributed as the `fluree` wheel (built by maturin), not on crates.io.
publish = false

[lib]
name = "_fluree"
crate-type = ["cdylib"]
# The tests are pytest suites under tests/; a Rust test harness for an
# extension module would have to link libpython, which CI does not provide.
test = false
doctest = false

[features]
# The extension module itself. maturin turns it on (pyproject.toml); without
# it the crate is empty, so a workspace build (the CLI release's, under fat
# LTO) does not link a second copy of the engine it never ships.
extension = [
    "dep:bytes",
    "dep:fluree-db-api",
    "dep:fluree-db-core",
    "dep:fluree-db-nameservice",
    "dep:fluree-db-query",
    "dep:fluree-db-sparql",
    "dep:fluree-vocab",
    "dep:pyo3",
    "dep:pythonize",
    "dep:serde",
    "dep:serde_json",
    "dep:stacker",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
bytes = { version = "1", optional = true }
# The engine features the CLI ships with (fluree-db-cli's default set, less
# its server): S3/DynamoDB storage, SHACL, Iceberg / SQL / Delta graph
# sources, and GraphQL.
fluree-db-api = { path = "../fluree-db-api", features = [
    "native",
    "shacl",
    "aws",
    "iceberg",
    "sql",
    "delta",
    "graphql",
], optional = true }
fluree-db-core = { path = "../fluree-db-core", optional = true }
fluree-db-nameservice = { path = "../fluree-db-nameservice", optional = true }
fluree-db-query = { path = "../fluree-db-query", optional = true }
fluree-db-sparql = { path = "../fluree-db-sparql", optional = true }
fluree-vocab = { path = "../fluree-vocab", optional = true }
pyo3 = { version = "0.29", optional = true }
pythonize = { version = "0.29", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
stacker = { version = "0.1", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true
