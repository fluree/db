[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fluree"
description = "Fluree: a graph database with time travel, history, and fine-grained policy"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
keywords = ["rdf", "sparql", "json-ld", "graph-database", "database"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Database :: Database Engines/Servers",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
pandas = ["pandas>=2"]
polars = ["polars>=1"]

[project.urls]
Homepage = "https://flur.ee"
Documentation = "https://fluree.github.io/db/python/"
Source = "https://github.com/fluree/db"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "mypy>=1.10", "pandas-stubs", "pandas", "polars"]

[tool.maturin]
python-source = "python"
module-name = "fluree._fluree"
# `extension` is the module itself: without it the crate is empty, so a plain
# workspace build (the CLI release's among them) skips it. abi3-py310: one wheel
# per platform for every CPython >= 3.10. Set here, not as a crate feature, so
# workspace `--all-features` builds do not demand a 3.10+ interpreter; plain
# cargo builds use whichever Python is installed.
features = ["extension", "pyo3/extension-module", "pyo3/abi3-py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["python/fluree"]
python_version = "3.10"
