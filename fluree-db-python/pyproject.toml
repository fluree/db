[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fluree"
description = "Fluree: a graph database with time travel, history, and fine-grained policy"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
keywords = ["rdf", "sparql", "json-ld", "graph-database", "database"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Database :: Database Engines/Servers",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
pandas = ["pandas>=2"]

[project.urls]
Homepage = "https://flur.ee"
Source = "https://github.com/fluree/db"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "fluree._fluree"
# abi3-py310: one wheel per platform for every CPython >= 3.10. Set here, not
# as a crate feature, so workspace `--all-features` builds do not demand a 3.10+
# interpreter; plain cargo builds use whichever Python is installed.
features = ["pyo3/extension-module", "pyo3/abi3-py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
