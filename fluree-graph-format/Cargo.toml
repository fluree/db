[package]
name = "fluree-graph-format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RDF graph formatters for JSON-LD, Turtle, and other formats"

[dependencies]
fluree-graph-ir = { path = "../fluree-graph-ir" }
fluree-vocab = { path = "../fluree-vocab" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The writers' round-trip tests parse their own output back.
fluree-graph-turtle = { path = "../fluree-graph-turtle" }
pretty_assertions = "1.4"

[lints]
workspace = true
