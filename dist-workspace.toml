[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew tap for publishing
tap = "fluree/homebrew-tap"
# Name the formula "fluree" instead of "fluree-db-cli"
formula = "fluree"
# Enable Homebrew publish job
publish-jobs = ["homebrew"]
# Allow modifying the generated CI file (for custom Docker job)
allow-dirty = ["ci"]

# Machine-readable CLI surface manifest, generated by the binary itself
# (`fluree manifest`) so it cannot drift from what ships; published as a
# release asset and consumed by CI in fluree/solo and fluree/claude-plugins
# to validate the `fluree ...` command strings they ship.
#
# Deliberately a DEBUG build: extra-artifacts run in the global-artifacts job
# on the default 4-core/16GB hosted runner with a cold cache, and this
# workspace's release profile is fat-LTO + codegen-units=1 — the exact
# configuration the runner note below records as OOMing at link time. The
# manifest is pure clap-tree introspection; optimization buys nothing.
# It describes the shipped surface because neither this config nor release.yml
# passes --features (both get the default set); if a features key is ever
# added to the dist config, this build must get the same one.
[[dist.extra-artifacts]]
artifacts = ["fluree-cli-manifest.json"]
build = [
    "cargo",
    "run",
    "-p",
    "fluree-db-cli",
    "--",
    "manifest",
    "--output",
    "fluree-cli-manifest.json",
]

[dist.github-custom-runners]
# Native ARM64 build on the org's larger hosted runner (8-core/32GB). The
# default 4-core/16GB ubuntu-24.04-arm OOM'd at link time under fat LTO
# (runner lost communication ~59min); 32GB gives ~2x headroom.
aarch64-unknown-linux-gnu = "asset-publisher-8-core"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
