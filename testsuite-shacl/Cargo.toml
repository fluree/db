[package]
name = "testsuite-shacl"
version = "4.2.0"
edition = "2021"
publish = false

[dependencies]
# Fluree crates (for testing)
fluree-db-api = { path = "../fluree-db-api", features = ["native", "shacl"] }
fluree-db-core = { path = "../fluree-db-core" }
fluree-graph-turtle = { path = "../fluree-graph-turtle" }
fluree-graph-ir = { path = "../fluree-graph-ir" }

# Test infrastructure
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.dev]
opt-level = 1
# Mirrors the root workspace's [profile.dev]. This package sits in the root
# `exclude` list and is therefore its own workspace root, so it does not
# inherit that profile: without this line its binaries carry packed DWARF and
# duplicate the fluree dependency tree's debug info into each one.
split-debuginfo = "unpacked"
