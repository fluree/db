[package]
name = "fluree-db-ontology"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ontology and catalog tools for document extraction: check what an extraction model reads, slice and convert vocabularies"

[dependencies]
fluree-graph-ir = { path = "../fluree-graph-ir" }
fluree-graph-turtle = { path = "../fluree-graph-turtle" }
fluree-graph-json-ld = { path = "../fluree-graph-json-ld" }
fluree-graph-format = { path = "../fluree-graph-format" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `ontology from`: CSV headers and rows, workbook sheets, SQL DDL
csv = "1.4"
fluree-doc-xlsx.workspace = true
sqlparser = "0.63"
# `ontology from`: semantic-layer YAML (Snowflake semantic views; dbt next)
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }

[dev-dependencies]
pretty_assertions = "1.4"

[lints]
workspace = true
