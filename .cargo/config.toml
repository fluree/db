# WASM spike: zstd-sys (C code) needs a wasm32-capable clang; Apple clang has no
# WebAssembly backend, so point cc at Homebrew LLVM for the wasm target only.
[env]
CC_wasm32-unknown-unknown = "/opt/homebrew/opt/llvm/bin/clang"
AR_wasm32-unknown-unknown = "/opt/homebrew/opt/llvm/bin/llvm-ar"

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
