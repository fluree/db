[package]
name = "fluree-raft-core"
description = "Application-agnostic Raft substrate: durable log/snapshot storage, node identity, and rendezvous ownership"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# No `fluree-db-*` dependencies, by design: this crate is the generic
# half of what used to live in `fluree-db-consensus::raft`, and every
# consumer (the nameservice group today; workflow / entity-resolution
# groups next) instantiates it against its own state machine.
#
# Also, deliberately, no `openraft` dependency yet. Nothing in this
# crate's current surface needs one: the storage traits are defined in
# terms of opaque `Vec<u8>` payloads, and `ClusterNode` satisfies
# openraft's blanket `Node` impl through its derives alone. openraft
# arrives with the log/network/admin adapters.

[features]
default = []
# Gates `openraft` and the adapters built on it (log storage, HTTP
# transport, membership admin, leader forwarding). Off by default so
# consumers that only want the storage traits, node/group identity, or
# rendezvous ownership — and monolithic Fluree builds, which reach this
# crate through `fluree-db-consensus` for `http::is_hop_by_hop` — do not
# compile or link openraft.
raft = ["dep:openraft", "dep:axum", "dep:reqwest", "dep:http-body-util", "dep:tokio-util"]
# Conformance fixture for `AppStateMachine` implementations. Separate
# from `raft` so it can be enabled as a dev-dependency by consumers
# without shipping the fixture in their release builds.
testing = ["raft"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Wire and on-disk encoding for log entries, vote, and snapshot
# metadata in the filesystem backend.
postcard = { workspace = true }

# `tokio::fs` + `AsyncWriteExt` for the filesystem backend's
# write-fsync-rename discipline.
tokio = { workspace = true }

# Deterministic, fixed-seed hash for rendezvous ownership. Every node
# must agree on hash values, so this cannot be `std`'s randomly-seeded
# `DefaultHasher`. xxh64 is stable across releases of the crate.
xxhash-rust = { workspace = true, features = ["xxh64"] }

# Gated behind `raft` — only the openraft-facing adapters need these.
# Pinned to a current release line; bumping should be tracked alongside
# any state-machine / storage-format changes.
openraft = { version = "0.9", optional = true, features = [
    "serde",
    "storage-v2",
    "single-term-leader",
] }
# HTTP server for the inter-node RPC layer; consumers nest the returned
# `axum::Router` under whatever path they want.
axum = { workspace = true, optional = true }
# HTTP client for the same layer, and for follower->leader forwarding.
reqwest = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
# `CancellationToken` for the leader-task lifecycle.
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
serde_json = { workspace = true }
tempfile = "3.19"
axum = { workspace = true }
tokio-util = { version = "0.7" }
xxhash-rust = { workspace = true, features = ["xxh64"] }

[lints]
workspace = true
