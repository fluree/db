[package]
name = "fluree-db-binary-index"
description = "Binary columnar index formats, codecs, and read-side runtime for Fluree DB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fluree-db-core = { path = "../fluree-db-core" }
fluree-vocab = { path = "../fluree-vocab" }

# Core dependencies
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Index format dependencies
zstd.workspace = true
rustc-hash = "2"
ciborium = "0.2"

# Cache
# moka is native-only: its eviction clock aborts on wasm32 (see fluree-db-core::wasm_cache)

# Concurrency
once_cell.workspace = true
parking_lot = "0.12"
futures.workspace = true

# Numeric types (for NumBig arena)
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
bigdecimal = { version = "0.4", features = ["serde"] }

# Hashing
xxhash-rust = { workspace = true, features = ["xxh3"] }

# Date/time
chrono.workspace = true

# Content addressing
sha2.workspace = true
hex.workspace = true

# Text analysis (shared analyzer for fulltext indexing + query scoring)
regex = "1"
rust-stemmers = "1.2"

[dev-dependencies]
async-trait.workspace = true
fluree-db-novelty = { path = "../fluree-db-novelty" }

[lints]
workspace = true

# Native: full tokio + mmap + real spatial provider; core's filesystem backends.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moka = { workspace = true }
fluree-db-core = { path = "../fluree-db-core", features = ["native"] }
fluree-db-spatial = { path = "../fluree-db-spatial" }
tokio = { workspace = true }
memmap2 = "0.9"

# wasm32: single-threaded, no mmap/threads; tokio limited to wasm-supported features.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time"] }
# moka's uuid needs a JS randomness source on wasm32-unknown-unknown
uuid = { version = "1", default-features = false, features = ["js"] }
