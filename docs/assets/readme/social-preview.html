<!doctype html>
<!--
  Source for social-preview.png (1280x640), the GitHub repository social preview.
  Regenerate from the repo root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1280,640 --screenshot=docs/assets/readme/social-preview.png \
      "file://$PWD/docs/assets/readme/social-preview.html"
  The benchmark figure must match the README's generated BENCH block.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fluree social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 85% 10%, #202152 0%, #091133 55%);
    color: #FDFDFD;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box; padding: 88px 96px 80px;
  }
  .logo { height: 72px; width: auto; align-self: flex-start; }
  h1 { font-size: 64px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; margin: 0; max-width: 1000px; }
  .stat { display: flex; align-items: baseline; gap: 22px; }
  .num { font-size: 56px; font-weight: 700; color: #13C6FF; letter-spacing: -0.01em; }
  .label { font-size: 26px; line-height: 1.35; color: #C9D3EC; }
  .repo { position: absolute; right: 96px; top: 104px; font-size: 24px; color: #C9D3EC; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
  <img class="logo" src="fluree-wordmark-dark.svg" alt="Fluree">
  <div class="repo">github.com/fluree/db</div>
  <h1>The graph database that remembers everything, and proves it.</h1>
  <div class="stat">
    <span class="num">16.1 ms</span>
    <span class="label">geometric mean on DBLP-core (561M triples).<br>QLever takes 12.6&times; as long. Reproducible at fluree/benchmark-db.</span>
  </div>
</body>
</html>
