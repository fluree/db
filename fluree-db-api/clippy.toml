# RDF text is staged from one parse (`fluree_db_transact::parse_rdf_text`).
# Converting it to JSON-LD first loses collection order, refuses IRIs whose
# scheme reads as an undefined prefix (`tag:`, `kb:`), and reads literals
# differently from insert, so no transaction lane may do it quietly.
disallowed-methods = [
    { path = "fluree_graph_turtle::parse_to_json", reason = "lossy JSON-LD round trip: stage RDF text with fluree_db_transact::parse_rdf_text" },
]
