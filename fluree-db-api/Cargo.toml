[package]
name = "fluree-db-api"
autotests = false
description = "High-level API for Fluree DB operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = ["fluree-db-nameservice/native", "fluree-db-core/native", "fluree-db-query/native", "fluree-db-connection/native", "dep:sysinfo"]
# Enable AWS-backed storage support (S3, storage-backed nameservice,
# vended-credential minting).
aws = ["fluree-db-connection/aws", "dep:fluree-db-storage-aws", "dep:aws-sdk-sts"]
# Iceberg / R2RML graph source support (pulls in AWS SDK + native deps). The
# Arrow columnar reader is the single graph-source read path (native predicate
# pushdown: row-group skipping + exact row filtering).
iceberg = ["dep:fluree-db-iceberg", "fluree-db-iceberg/aws"]
# Opt-in LocalStack-backed S3/DynamoDB tests (auto-start via testcontainers)
aws-testcontainers = [
  "dep:fluree-db-storage-aws",
  "dep:testcontainers",
  "dep:aws-config",
  "dep:aws-sdk-s3",
  "dep:aws-sdk-dynamodb",
]
# DID/JWS/VerifiableCredential support for signed queries/transactions
# Pulls in ed25519-dalek, bs58, etc. Default off to reduce compile times.
credential = ["dep:fluree-db-credential"]
# SHACL validation (requires fluree-db-transact + fluree-db-shacl)
shacl = ["dep:fluree-db-shacl", "fluree-db-transact/shacl"]
# GraphQL endpoint (schema derived from ledger metadata; pulls in async-graphql)
# Tier 2 reads SHACL shapes, so `shacl` comes with it.
graphql = ["dep:fluree-db-graphql", "shacl"]
# Temporary benchmark examples (opt-in so `cargo test` stays fast)
benchmarks = []
# Remote search client (HTTP client for remote search service)
search-remote-client = ["dep:reqwest"]
# Embedded vector search (HNSW-based approximate nearest neighbor)
vector = ["fluree-db-query/vector"]
# IPFS-backed storage (via Kubo HTTP RPC)
ipfs = ["dep:fluree-db-storage-ipfs"]
# Convenience bundle (excludes vector, aws, and test-only features)
full = ["native", "credential", "iceberg", "shacl", "ipfs", "graphql"]

[dependencies]
fluree-db-core = { path = "../fluree-db-core" }
parking_lot = "0.12"
lru = { workspace = true }
fluree-db-crypto = { path = "../fluree-db-crypto", features = ["nameservice"] }
fluree-db-connection = { path = "../fluree-db-connection", default-features = false }
fluree-db-policy = { path = "../fluree-db-policy" }
fluree-db-query = { path = "../fluree-db-query" }
fluree-db-ledger = { path = "../fluree-db-ledger" }
fluree-db-novelty = { path = "../fluree-db-novelty" }
fluree-db-nameservice = { path = "../fluree-db-nameservice", default-features = false }
fluree-db-binary-index = { path = "../fluree-db-binary-index" }
fluree-db-sparql = { path = "../fluree-db-sparql" }
fluree-db-cypher = { path = "../fluree-db-cypher" }
fluree-db-graphql = { path = "../fluree-db-graphql", optional = true }
fluree-db-iceberg = { path = "../fluree-db-iceberg", default-features = false, optional = true, features = ["aws"] }
fluree-db-r2rml = { path = "../fluree-db-r2rml", features = ["turtle"] }
fluree-db-tabular = { path = "../fluree-db-tabular" }
fluree-db-storage-aws = { path = "../fluree-db-storage-aws", optional = true }
fluree-db-storage-ipfs = { path = "../fluree-db-storage-ipfs", optional = true }
fluree-search-protocol = { path = "../fluree-search-protocol" }
fluree-graph-ir = { path = "../fluree-graph-ir" }
fluree-graph-format = { path = "../fluree-graph-format" }
fluree-graph-turtle = { path = "../fluree-graph-turtle" }
flate2 = { workspace = true }
zstd = { workspace = true }
fluree-db-credential = { path = "../fluree-db-credential", optional = true }
fluree-db-shacl = { path = "../fluree-db-shacl", optional = true }
fluree-vocab = { path = "../fluree-vocab" }
fluree-graph-json-ld = { path = "../fluree-graph-json-ld" }

async-trait.workspace = true
bytes = "1.4"
chrono.workspace = true
futures.workspace = true
indexmap.workspace = true
# moka is native-only: its eviction clock aborts on wasm32 (see fluree-db-core::wasm_cache)
rustc-hash = "2"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# SHA-256 of the R2RML mapping for the materialize twin's completion stamp.
sha2.workspace = true
tracing.workspace = true
# Used for fast xxh3_128 hashing in streaming dictionary merge.
xxhash-rust.workspace = true
# Base64 for encryption key decoding
base64 = "0.22"
hex.workspace = true
# Fast integer formatting for TSV output (zero-alloc); doubles use the
# canonical xsd:double writer from fluree-graph-ir
itoa.workspace = true
# CSV bulk import (neo4j-admin header convention → JSON-LD front-end)
csv = "1.4"
# Percent-encode CSV cell values into safe IRI segments
percent-encoding = "2"

# Opt-in AWS + LocalStack testing deps (feature-gated)
testcontainers = { version = "0.23", optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }

# HTTP client for remote search service (feature-gated)
reqwest = { workspace = true, optional = true }

# Platform directory resolution (XDG on Linux, Application Support on macOS)

# System memory detection for import memory budget auto-sizing (native only)
sysinfo = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile = "3.19"
# it_import_low_fd: the re-exec'd child lowers RLIMIT_NOFILE on itself.
libc = "0.2"
mimalloc.workspace = true
fs2 = "0.4"
# Used by import tests to produce .gz / .zst fixtures inline.
flate2 = { workspace = true }
zstd = { workspace = true }
# Numeric types used by datatype tests
num-bigint = "0.4"
num-bigdecimal = { package = "bigdecimal", version = "0.4" }
# For credential module tests (creates test JWS signatures).
# Note: Tests are gated via required-features=["credential"], but this dev-dep
# may still compile. The main compile-time win is avoiding fluree-db-credential
# and its full dep tree when the feature is off.
ed25519-dalek = "2.1"
criterion = { version = "0.5", features = ["async_tokio"] }
fluree-bench-support = { path = "../fluree-bench-support" }
fluree-bench-alloc = { path = "../fluree-bench-alloc" }
rand = { workspace = true }
fluree-db-nameservice-sync = { path = "../fluree-db-nameservice-sync" }
# Residency-mode read arms for the wasm read-path recovery tests
# (it_residency_retry): dev-only feature unification — production native
# builds keep the feature off and compile the pre-residency read path.
fluree-db-query = { path = "../fluree-db-query", features = ["residency"] }
fluree-db-binary-index = { path = "../fluree-db-binary-index", features = ["residency"] }

[[test]]
name = "it_residency_retry"
path = "tests/it_residency_retry.rs"

[[test]]
name = "grp_graphsource"
path = "tests/grp_graphsource.rs"

[[test]]
name = "grp_import"
path = "tests/grp_import.rs"

# Standalone (NOT in grp_import): re-execs itself and lowers RLIMIT_NOFILE
# hard+soft in the child, which must not share a process with other tests.
[[test]]
name = "it_import_low_fd"
path = "tests/it_import_low_fd.rs"

# Standalone: end-to-end over a REAL local Iceberg table. Runs unconditionally
# in CI against the committed fixture (tests/fixtures/iceberg/silver/people);
# it sets FLUREE_ICEBERG_LOCAL_ROOTS itself, and FLUREE_LOCAL_ICEBERG_TABLE
# optionally points it at a different table. Standalone because it writes
# process env, which must not race other tests.
[[test]]
name = "it_iceberg_local_fs"
path = "tests/it_iceberg_local_fs.rs"
required-features = ["iceberg", "native"]

# Standalone for the same reason: catalog-less WAREHOUSE-ROOT resolution through
# every Direct entry point, against the committed fixture's parent directory.
[[test]]
name = "it_iceberg_warehouse_root"
path = "tests/it_iceberg_warehouse_root.rs"
required-features = ["iceberg", "native"]

