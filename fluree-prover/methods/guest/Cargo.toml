[package]
name = "redact"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
# The reference C zstd decoder: about 30% fewer cycles than `ruzstd`.
default = ["c-zstd"]
c-zstd = ["fluree-db-redaction/c-zstd"]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
fluree-db-redaction = { path = "../../../fluree-db-redaction", default-features = false }

# The zkVM's accelerated curve25519 arithmetic for Ed25519 verification,
# over its accelerated big-integer arithmetic.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
