[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
risc0-zkvm = { version = "^3.0.6" }
fluree-db-redaction = { path = "../../../fluree-db-redaction", features = ["host-sha"] }
fluree-db-core = { path = "../../../fluree-db-core", features = ["credential"] }
fluree-db-credential = { path = "../../../fluree-db-credential" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
libc = "0.2"
hex = "0.4"
anyhow = "1"
getrandom = "0.2"
