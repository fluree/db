[package]
name = "fluree-db-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime-agnostic core library for Fluree DB queries"

[features]
# Default to runtime-agnostic behavior.
# Enable `native` for filesystem-backed implementations that depend on tokio.
default = []
native = ["tokio", "moka", "dashmap", "fs2", "dep:rand"]
credential = ["dep:fluree-db-credential"]

[dependencies]
fluree-vocab = { path = "../fluree-vocab" }
futures = { workspace = true }
async-trait = { workspace = true }
hashbrown = { workspace = true }
once_cell = { workspace = true }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
cid = { workspace = true }
multihash = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"], optional = true }
fs2 = { version = "0.4", optional = true }
xxhash-rust = { workspace = true }
# Per-process token in `FileStorage` staging-file names. The pid alone
# is unique per host, not across hosts sharing a mount.
rand = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }

# Numeric and temporal types
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono.workspace = true

# Commit-local string dictionaries
rustc-hash = "2"

# Binary serialization for flakes transport
ciborium = "0.2"

# Commit v2/v3 binary codec
zstd = { workspace = true }
tracing = { workspace = true }

# Optional: commit signing (used by commit_v2 writer)
fluree-db-credential = { path = "../fluree-db-credential", optional = true }

# RLIMIT_NOFILE introspection/raise (fd_limit module)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
postcard = { workspace = true }
tempfile = "3"

[lints]
workspace = true

# wasm32: disk_cache compiles (std::fs stubs + tokio::sync::broadcast); reads
# behave as misses at runtime. Only the wasm-supported tokio features.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }
# Central JS-randomness unification for the whole wasm graph (feature
# unification applies per-target): rand/rand_core need getrandom/js,
# moka's uuid needs uuid/js. Declared once here since core is in every graph.
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", default-features = false, features = ["js"] }
