name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pushes to main should cancel stale CI just like PR updates do.
# Cache note: `save-if: main` still fires on a cancelled main job, because
# `cache-on-failure: true` makes rust-cache's post step run on any status.
# A burst of merges can therefore save a partially built target dir under
# the exact key; later main runs hit that key and skip saving until
# Cargo.lock, the toolchain, or another keyed input changes. Degraded, not
# cold: PRs still restore whatever was saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Linker experiment: was `-fuse-ld=bfd` (slowest GNU linker, set at the v4
  # baseline with no recorded rationale). `mold` links several times faster;
  # every compiling job below installs it via `rui314/setup-mold`.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

# Save dependency caches on main; PRs restore them without filling the cache
# quota with copies that other PRs and main cannot reuse.
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          mkdir -p actionlint-bin
          tar -xzf actionlint.tar.gz -C actionlint-bin actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        run: actionlint -shellcheck= -pyflakes=

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Free disk space
        run: |
          # Avoid spending a minute deleting SDKs when the runner has room.
          available_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          if [ "$available_kb" -lt 15728640 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
          fi
          df -h /

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --all --all-features --all-targets --locked -- -D warnings

      # Clippy and the nextest job are both --all-features, so a target
      # that only fails to compile under DEFAULT features (e.g. an example
      # using feature-gated API without a `required-features` gate) is
      # invisible to them. This compiles the shape a contributor's bare
      # `cargo test -p <crate>` reaches first. Keep it alongside Clippy so it
      # runs in parallel with nextest instead of extending the test job.
      - name: Check (default features)
        run: cargo check --workspace --all-targets --locked

  test:
    # 8 cores / 32 GB: the workspace compile and nextest run are the CI critical path.
    runs-on: ci-cd-large
    # Backstop so a hung/deadlocked test can never hold a runner for the full
    # 6h default again. Per-test kills are handled by `slow-timeout` in
    # `.config/nextest.toml`; this is the job-level safety net.
    timeout-minutes: 45
    steps:
      - name: Runner capacity
        run: |
          nproc
          free -h
          df -h /

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --all-features --no-fail-fast --locked

      # Nextest does not execute rustdoc examples. Reuse the all-feature build
      # above so public API examples cannot silently stop compiling or running.
      - name: Documentation tests
        timeout-minutes: 10
        run: cargo test --workspace --all-features --doc --locked

  testsuite-sparql:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Free disk space
        run: |
          # Avoid spending a minute deleting SDKs when the runner has room.
          available_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          if [ "$available_kb" -lt 15728640 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
          fi
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: "testsuite-sparql -> target"

      - name: Format
        working-directory: testsuite-sparql
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: testsuite-sparql
        run: cargo clippy --all-targets -- -D warnings

      # Full W3C compliance run. Every suite must be green: each test either
      # passes or is listed in tests/registers/mod.rs. check_testsuite fails a
      # suite on any unexpected failure AND on any stale register entry (a
      # registered test that now passes), so the registers can only shrink.
      # See docs/contributing/sparql-compliance.md.
      - name: Run W3C SPARQL test suites
        working-directory: testsuite-sparql
        timeout-minutes: 45
        run: cargo test

  sql-bridge:
    # fluree-sql-bridge is a standalone workspace (it links sqlx + three
    # database drivers, none of which belong in the fluree binary), so the
    # workspace gates above never reach it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # SQLite exercises the protocol in-process, but it is the one backend whose
    # string literals cannot misbehave. The escaping rule the bridge enforces
    # (NO_BACKSLASH_ESCAPES on MySQL) is only observable against a real server,
    # so both are supplied here. `server_backends_are_configured_in_ci` fails if
    # these ever stop being set, so a skipped test cannot read as a pass.
    # Both servers run five hours behind UTC so that a zoned literal or value
    # which silently lost its zone is off by five hours, not by nothing.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: fluree
          MYSQL_DATABASE: bridge_test
          TZ: America/New_York
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfluree"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fluree
          POSTGRES_DB: bridge_test
          TZ: America/New_York
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            fluree-sql-bridge -> target
            . -> target

      - name: Format
        working-directory: fluree-sql-bridge
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: fluree-sql-bridge
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (SQLite, MySQL and Postgres backed protocol tests)
        working-directory: fluree-sql-bridge
        env:
          FLUREE_BRIDGE_MYSQL_URL: mysql://root:fluree@127.0.0.1:3306/bridge_test
          FLUREE_BRIDGE_POSTGRES_URL: postgres://postgres:fluree@127.0.0.1:5432/bridge_test
        run: cargo test

      # The SQL pushdown lane's golden tests pin statements against a fake
      # endpoint; only a real database can confirm those statements return
      # the rows the per-scan lane returns and the rows the fake pinned. The
      # bridge is already built here, so run one over each database (an empty
      # SQLite file, and the two services) and replay every lane case through
      # all three. The tests seed their own tables and skip loudly when a URL
      # is unset; `live_bridge_backends_are_configured_in_ci` fails if any of
      # the three is missing, so a skipped backend cannot read as a pass.
      - name: Start a bridge over each database
        run: |
          bridge=fluree-sql-bridge/target/debug/fluree-sql-bridge
          "$bridge" --database "sqlite://$RUNNER_TEMP/lane.db?mode=rwc" --listen 127.0.0.1:18080 &
          "$bridge" --database "postgres://postgres:fluree@127.0.0.1:5432/bridge_test" --listen 127.0.0.1:18081 &
          "$bridge" --database "mysql://root:fluree@127.0.0.1:3306/bridge_test" --listen 127.0.0.1:18082 &
          for port in 18080 18081 18082; do
            up=
            for i in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:$port/v1/info" >/dev/null; then up=1; break; fi
              sleep 1
            done
            if [ -z "$up" ]; then echo "bridge on $port did not come up" >&2; exit 1; fi
          done

      - name: Pushdown lane differential against SQLite, Postgres and MySQL
        env:
          # `live_bridge_backends_are_configured_in_ci` keys on this marker to
          # know it is in the job that starts the bridges, and then requires all
          # three URLs below. Keep them together.
          FLUREE_LIVE_BRIDGE: "1"
          FLUREE_SQL_BRIDGE_URL: http://127.0.0.1:18080
          FLUREE_SQL_BRIDGE_POSTGRES_URL: http://127.0.0.1:18081
          FLUREE_SQL_BRIDGE_MYSQL_URL: http://127.0.0.1:18082
        run: cargo test -p fluree-db-api --features sql,native --test it_sql_pushdown_lane --test it_sql_graph_source live_bridge

  # Keeps the wasm32-unknown-unknown build honest: the whole engine stack must
  # keep compiling for the browser target (fluree-db-api pulls every wasm-path
  # crate), and the parse layer must keep compiling with NO default features
  # (the parse-only Lambda/WASM consumer contract). Runs on the same pinned
  # toolchain as the native jobs. Job-level RUSTFLAGS: the workflow-global
  # mold linker flag doesn't apply to wasm, and setting RUSTFLAGS here would
  # otherwise mask the target-scoped `getrandom_backend` cfg from
  # .cargo/config.toml — so the cfg is restated explicitly.
  wasm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # -D warnings: `cargo check` exits 0 on warnings, so without this the
      # branch's zero-warning wasm build could rot silently (registry deps
      # stay cap-linted, so only workspace code is gated).
      RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            wasm-probe -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      # clippy, not check: `cargo check` cannot see clippy-only lints, and
      # nothing else runs clippy against the wasm32 target. Three of those
      # lints (a dropped un-awaited future in the CAS bridge stub, a needless
      # return in a wasm-cfg storage arm, an explicit into_iter loop in the
      # sequential multi-query twin) sat red under this command while the
      # check-only gate reported green. clippy lints every workspace member in
      # the -p closure at lib level, so this covers the engine crates behind
      # fluree-db-api, nameservice-sync and the browser crate, not just the
      # umbrellas.
      # No --all-targets: it drags in fluree-db-api's dev-dependencies, whose
      # tokio `net`/mio does not build for wasm32 (unrelated to our code).
      - name: Lint engine stack (wasm32 clippy)
        run: cargo clippy --target wasm32-unknown-unknown -p fluree-db-api -p fluree-db-nameservice-sync -p fluree-db-browser --no-default-features

      - name: Lint parse layer, no default features (wasm32 clippy)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features -p fluree-vocab -p fluree-graph-ir -p fluree-graph-turtle -p fluree-graph-json-ld -p fluree-db-sparql

      # Compiling is not running: wasm32-unknown-unknown panics at RUNTIME on
      # Instant::now / SystemTime::now, thread spawns, and moka construction,
      # none of which the check above can see. The probe drives the real
      # memory-ledger create -> insert -> SPARQL query path under Node and
      # exits 0 only on the future's own Ok (see wasm-probe/README.md).
      - name: Runtime smoke (wasm32 under Node)
        run: node wasm-probe/run-node.mjs

  # Executes the browser build (the wasm32 job only proves it compiles).
  # 1. The playground binding runs create → insert → query → format inside a
  #    dedicated worker in headless Chrome (wasm-bindgen-test, assertions on
  #    returned rows — a positive ran-marker, never "didn't crash").
  # 2. The SHIPPED npm package (main-thread proxy → module worker → wasm) is
  #    driven end to end over the DevTools protocol with no COOP/COEP headers,
  #    which is the package's hosting contract.
  # ubuntu-24.04 ships a matching Chrome + chromedriver pair. Same RUSTFLAGS
  # restatement as the wasm32 job (an env RUSTFLAGS masks .cargo/config.toml).
  wasm-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # wasm-pack pinned via the same installer action the wasm32 job uses —
      # not an unpinned `curl | sh`.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Install wasm-bindgen CLI (Cargo.lock version) and binaryen
        # Native host build: clear the job-level wasm `getrandom_backend` cfg
        # (getrandom 0.3.4+ hard-errors when that cfg is set for a non-wasm
        # target), exactly as the fluree-server native build step below does.
        env:
          RUSTFLAGS: ""
        run: |
          VER=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | tail -1 | cut -d'"' -f2)
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" != "$VER" ]; then
            cargo install wasm-bindgen-cli --version "$VER" --locked --force
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq binaryen

      - name: Browser tests (wasm-bindgen-test in a dedicated worker, headless Chrome)
        run: wasm-pack test --headless --chrome fluree-db-wasm

      # The browser I/O crate's real-browser suites (fetch round-trip, error
      # classification, IndexedDB persistence, SSE streaming) — review H-3:
      # without this line they never execute in CI.
      - name: Browser I/O tests (headless Chrome)
        run: wasm-pack test --headless --chrome fluree-db-browser

      - name: Build npm package (wasm-release profile + wasm-opt + tsc)
        working-directory: fluree-db-wasm/js
        run: |
          npm ci
          node scripts/build.mjs

      # --packed: smoke the `npm pack` tarball, not the repo dir, so a `files`
      # allowlist regression (e.g. the .wasm dropped from the tarball) fails
      # here instead of in consumers' installs.
      - name: Smoke the packed package (headless Chrome over CDP, no isolation headers)
        working-directory: fluree-db-wasm/js
        run: node scripts/smoke-browser.mjs --packed

      - name: Size report
        run: cat fluree-db-wasm/js/pkg/size-report.json
