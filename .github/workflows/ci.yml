name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Linker experiment: was `-fuse-ld=bfd` (slowest GNU linker, set at the v4
  # baseline with no recorded rationale). `mold` links several times faster;
  # every compiling job below installs it via `rui314/setup-mold`.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --all --all-features --all-targets

  test:
    runs-on: ubuntu-latest
    # Backstop so a hung/deadlocked test can never hold a runner for the full
    # 6h default again. Per-test kills are handled by `slow-timeout` in
    # `.config/nextest.toml`; this is the job-level safety net.
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --all-features --no-fail-fast

  testsuite-sparql:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: "testsuite-sparql -> target"

      - name: Format
        working-directory: testsuite-sparql
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: testsuite-sparql
        run: cargo clippy --all-targets -- -D warnings

      # Full W3C compliance run. Every suite must be green: each test either
      # passes or is listed in tests/registers/mod.rs. check_testsuite fails a
      # suite on any unexpected failure AND on any stale register entry (a
      # registered test that now passes), so the registers can only shrink.
      # See docs/contributing/sparql-compliance.md.
      - name: Run W3C SPARQL test suites
        working-directory: testsuite-sparql
        timeout-minutes: 45
        run: cargo test

  bench-compare:
    # Cheap per-PR perf gate. Runs the two cheapest benches at tiny/quick and
    # compares against the committed baseline. MEMORY breaches FAIL the job
    # (peak_mem is comparable cross-machine — reviewer measured ±2.2%); wall-clock
    # TIME breaches are ADVISORY (::warning:: annotations, non-gating) because the
    # committed baseline is runner_class=local and shared ubuntu-latest runners
    # flap — a 10% time budget on a single PR run false-positives (BENCHMARKING.md,
    # "Baselines: capture & compare"). Once a ci-* baseline is committed (via
    # bench.yml's workflow_dispatch capture job) the runner classes match and time
    # enforces automatically. The committed baseline contains exactly this cheap
    # subset, so `compare` needs no `--only`. Full workspace + medium: nightly.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUREE_BENCH_PROFILE: quick
      FLUREE_BENCH_SCALE: tiny
      # CI-class marker: baseline is runner_class=local, so compare auto-treats
      # time as advisory and enforces only memory.
      FLUREE_BENCH_RUNNER_CLASS: ci-ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Clear stale memory sidecars first: rust-cache persists target/ across
      # runs, and compare must not merge a mem number from a bench not rerun
      # this session (review item 10). Then run the two cheap benches (writes
      # criterion timings + fresh memory sidecars).
      - name: Run cheap benches (tiny, quick)
        run: |
          rm -rf target/fluree-bench-mem
          cargo bench -p fluree-db-api --bench query_overlay_matrix
          cargo bench -p fluree-db-api --bench query_hot_bsbm

      # Compare against the committed baseline: exit 1 on any MEMORY breach;
      # cross-machine time breaches print as ::warning:: annotations only.
      - name: Compare against committed baseline
        run: |
          cargo run -p fluree-bench-support --bin bench-baseline -- \
            compare --baseline bench-baselines/guardrails-pre.json
