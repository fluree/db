<!doctype html>
<meta charset="utf-8" />
<title>fluree-db-wasm smoke</title>
<pre id="out">running…</pre>
<script type="module">
  // Drives the shipped package end to end and publishes a machine-readable
  // verdict on window.__smoke (awaited by scripts/smoke-browser.mjs).
  // Phase 1: create → insert → query → ask. Phase 2: deliberate crash, then
  // recycle semantics (H-4/H-5): pre-crash snapshot handles must reject typed
  // instead of aliasing the fresh engine's snapshots. Phase 3: the peer-mode
  // boundary WITHOUT a server — the token event round-trip (init carries no
  // credential; the worker asks over the event channel) and a typed,
  // non-fatal failure when the remote is unreachable.
  import { connect, playground } from "../dist/index.js";

  const out = document.getElementById("out");
  const data = {
    "@context": { ex: "http://example.org/ns/" },
    "@graph": [
      { "@id": "ex:alice", "@type": "ex:Person", "ex:name": "Alice", "ex:age": 34,
        "ex:knows": { "@id": "ex:bob" } },
      { "@id": "ex:bob", "@type": "ex:Person", "ex:name": "Bob", "ex:age": 29 },
    ],
  };
  const sparql = `PREFIX ex: <http://example.org/ns/>
    SELECT ?name WHERE { ?p a ex:Person ; ex:name ?name } ORDER BY ?name`;
  const askKnows = "PREFIX ex: <http://example.org/ns/> ASK { ex:alice ex:knows ex:bob }";

  window.__smoke = (async () => {
    const timings = {};
    try {
      // — Phase 1: the happy path —
      let t0 = performance.now();
      const pg = await playground();
      timings.init = Math.round(performance.now() - t0);

      const ledger = await pg.createLedger("smoke");
      t0 = performance.now();
      const receipt = await ledger.insert(data);
      timings.insert = Math.round(performance.now() - t0);

      t0 = performance.now();
      const res = await ledger.query(sparql);
      timings.query = Math.round(performance.now() - t0);
      const names = res.results.bindings.map((b) => b.name.value);

      const ask = await ledger.query(askKnows);
      const info = await ledger.info();

      // — Phase 1b: live subscription (A4) on the playground —
      const liveUpdates = [];
      const liveSub = await pg.subscribe("smoke", sparql, (u) => liveUpdates.push(u));
      const until = async (cond, what) => {
        for (let i = 0; i < 400 && !cond(); i++) await new Promise((r) => setTimeout(r, 25));
        if (!cond()) throw new Error("timed out waiting for " + what);
      };
      await until(() => liveUpdates.length >= 1, "live prime");
      await ledger.sparqlUpdate(
        'PREFIX ex: <http://example.org/ns/> INSERT DATA { ex:carol a ex:Person ; ex:name "Carol" }');
      await until(() => liveUpdates.length >= 2, "live update after commit");
      await liveSub.unsubscribe();
      const liveRows = liveUpdates.map((u) => u.data?.results?.bindings?.length ?? -1);

      // — Phase 2: crash + recycle semantics —
      const preCrash = await ledger.snapshot();

      let crashCode = null;
      let crashFatal = null;
      try {
        await pg._debugCrash();
      } catch (e) {
        crashCode = e.code;
        crashFatal = e.fatal;
      }

      // The proxy respawns with backoff; poll until the fresh engine answers.
      let post = null;
      let recycleAttempts = 0;
      for (let i = 0; i < 40 && !post; i++) {
        recycleAttempts++;
        try {
          post = await pg.createLedger("post-crash");
        } catch {
          await new Promise((r) => setTimeout(r, 250));
        }
      }
      if (!post) throw new Error("engine never came back after the deliberate crash");
      await post.insert({
        "@context": { ex: "http://example.org/ns/" },
        "@id": "ex:zed", "@type": "ex:Person", "ex:name": "Zed",
      });
      // Fresh engine mints small handle numbers again — the aliasing H-4 guards.
      const postSnap = await post.snapshot();

      // Stale pre-crash snapshot must reject typed, never answer.
      let staleCode = null;
      try {
        await preCrash.query(askKnows);
      } catch (e) {
        staleCode = e.code;
      }
      // Releasing the stale snapshot must be a no-op for the fresh engine…
      await preCrash.release();
      // …so the fresh snapshot still answers afterwards.
      const postRows = await postSnap.query(
        'PREFIX ex: <http://example.org/ns/> ASK { ex:zed ex:name "Zed" }');
      const postAlive = postRows.boolean === true;

      pg.close();

      // — Phase 3: peer-mode boundary, no server —
      const tokenReasons = [];
      const peer = await connect("http://127.0.0.1:1/v1/fluree", {
        getToken: (reason) => {
          tokenReasons.push(reason);
          return "smoke-token";
        },
      });
      const peerVersion = peer.version;
      let peerLedgerCode = null;
      let peerLedgerFatal = null;
      try {
        // Unreachable server: the head resolution must fail TYPED (a
        // FlureeError with code/fatal), never as a crash or a hang.
        await peer.ledger("remote:main");
      } catch (e) {
        peerLedgerCode = e.code ?? null;
        peerLedgerFatal = e.fatal ?? null;
      }
      peer.close();

      const report = {
        status: "pass",
        version: pg.version,
        transport: "transfer",
        rows: names.length,
        names,
        ask: ask.boolean,
        t: info.t,
        receiptT: receipt.t,
        crashCode,
        crashFatal,
        staleCode,
        postAlive,
        recycleAttempts,
        live: { updates: liveUpdates.length, rows: liveRows },
        peer: {
          version: peerVersion,
          tokenReasons,
          ledgerCode: peerLedgerCode,
          ledgerFatal: peerLedgerFatal,
        },
        timings,
      };
      out.textContent = JSON.stringify(report, null, 2);
      return report;
    } catch (err) {
      const report = { status: "fail", error: String(err?.stack ?? err), timings };
      out.textContent = JSON.stringify(report, null, 2);
      return report;
    }
  })();
</script>
