<!doctype html>
<meta charset="utf-8" />
<title>fluree-db-wasm peer cold-open bench</title>
<pre id="out">running…</pre>
<script type="module">
  // Times ONE cold open of a remote ledger: connect → open (head resolve) →
  // query (CAS fetches + local execution). Driven by scripts/bench-preflight.mjs,
  // which launches a fresh Chrome per measurement so the profile — and so the
  // IndexedDB block cache AND the browser's own HTTP cache — is genuinely cold.
  //
  // The headline number is `coldOpenMs` (open + query), because that phase is
  // pure API traffic in every arm. `connectMs` is reported but excluded: it is
  // dominated by fetching and compiling the ~9 MB wasm, which in the
  // same-origin arm comes through the delayed tap and in the cross-origin arm
  // does not.
  import { connect } from "../dist/index.js";

  const out = document.getElementById("out");
  const params = new URLSearchParams(location.search);
  const api = params.get("api");
  const token = params.get("token");
  const ledgerId = params.get("ledger");

  const SPARQL = `PREFIX ex: <http://example.org/ns/>
    SELECT ?name WHERE { ?p a ex:Person ; ex:name ?name } ORDER BY ?name`;

  window.__bench = (async () => {
    try {
      const t0 = performance.now();
      const peer = await connect(api, { getToken: () => token });
      const connectMs = performance.now() - t0;

      // `wait` splits the run in two so a profiler can be armed around the
      // cold open ALONE: the ~1.3 s of worker boot and wasm compilation that
      // `connect()` covers would otherwise dominate a whole-run profile and
      // be misread as engine work.
      if (params.has("wait")) {
        window.__connected = true;
        for (let i = 0; i < 3000 && !window.__go; i++) await new Promise((r) => setTimeout(r, 10));
      }

      const tOpen = performance.now();
      const ledger = await peer.ledger(ledgerId);
      const openMs = performance.now() - tOpen;

      const tQuery = performance.now();
      const res = await ledger.query(SPARQL);
      const queryMs = performance.now() - tQuery;

      // The SAME query again at the SAME head, with everything now resident.
      // The cold/warm ratio separates intrinsic query cost from the cost of
      // the miss → drain → fetch → re-run machinery, without needing wasm
      // symbol names.
      const tWarm = performance.now();
      const warmRes = await ledger.query(SPARQL);
      const warmQueryMs = performance.now() - tWarm;
      const warmRows = warmRes?.results?.bindings?.length ?? -1;

      // And a fresh open of the same (already-loaded) ledger.
      const tReopen = performance.now();
      await peer.ledger(ledgerId);
      const reopenMs = performance.now() - tReopen;

      // A timing with no rows behind it is not a measurement of anything.
      const names = res?.results?.bindings?.map((b) => b.name.value) ?? [];
      // `keepalive` leaves the worker running so a CPU profile attached to it
      // can still be stopped and read — `close()` terminates the worker, and
      // a profiler session on a dead target never answers.
      if (!params.has("keepalive")) peer.close();

      const report = {
        status: names.length > 0 ? "pass" : "fail",
        names,
        connectMs: Math.round(connectMs),
        openMs: Math.round(openMs),
        queryMs: Math.round(queryMs),
        coldOpenMs: Math.round(openMs + queryMs),
        warmQueryMs: Math.round(warmQueryMs),
        warmRows,
        reopenMs: Math.round(reopenMs),
      };
      out.textContent = JSON.stringify(report, null, 2);
      return report;
    } catch (err) {
      const report = { status: "fail", error: String(err?.stack ?? err) };
      out.textContent = JSON.stringify(report, null, 2);
      return report;
    }
  })();
</script>
