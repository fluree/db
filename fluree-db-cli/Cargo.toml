[package]
name = "fluree-db-cli"
description = "Command-line interface for Fluree DB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://flur.ee"

[[bin]]
name = "fluree"
path = "src/main.rs"

[lib]
name = "fluree_db_cli"
path = "src/lib.rs"

[features]
# `aws` is on by default so the shipped CLI (incl. the Docker image, which
# reuses the dist binary) can use S3 storage + DynamoDB nameservice via
# connection config. Dormant unless configured; ~+2 MB over the AWS SDK that
# `iceberg` already pulls in.
default = ["server", "iceberg", "shacl", "aws"]
server = ["dep:fluree-db-server"]
iceberg = ["fluree-db-api/iceberg"]
aws = ["fluree-db-server/aws", "fluree-db-nameservice-sync/aws"]
# SHACL constraint validation at transaction time
shacl = ["fluree-db-api/shacl"]
# Use mimalloc as the global allocator (better multicore allocation throughput
# for query/import/materialization paths). Opt-in; enable in release packaging.
mimalloc = ["dep:mimalloc"]
otel = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
]

[dependencies]
# Optional global allocator (see the `mimalloc` feature).
mimalloc = { workspace = true, optional = true }
fluree-db-api = { path = "../fluree-db-api" }
# Temp dir for streaming CSV → .jsonl into the bulk import pipeline.
tempfile = "3"
# `fluree load` reads CSV rows client-side into batched Cypher upserts.
csv = "1.4"
fluree-db-novelty = { path = "../fluree-db-novelty" }
fluree-db-nameservice = { path = "../fluree-db-nameservice" }
fluree-db-core = { path = "../fluree-db-core" }
fluree-db-indexer = { path = "../fluree-db-indexer" }
fluree-vocab = { path = "../fluree-vocab" }
fluree-db-query = { path = "../fluree-db-query" }
fluree-db-binary-index = { path = "../fluree-db-binary-index" }
# Shared R2RML media-type resolver (MappingFormat) so the CLI infers the same
# ext→format table the server uses, instead of a divergent local copy (#1397).
fluree-db-r2rml = { path = "../fluree-db-r2rml" }

# `fluree rdf`: the RDF verbs parse and instrument directly against the light
# graph crates rather than going through the ledger API — there is no ledger.
fluree-graph-ir = { path = "../fluree-graph-ir" }
fluree-graph-turtle = { path = "../fluree-graph-turtle" }
# `fluree rdf convert`: the streaming writers the verb serializes through.
fluree-graph-format = { path = "../fluree-graph-format" }
# `--profile`'s box table. Every dependency of this crate is already in the
# CLI's graph, so sharing the renderer with the bench lane costs nothing and
# keeps the two tables comparable by construction.
fluree-bench-support = { path = "../fluree-bench-support" }

# Developer memory layer (store + CLI subcommands)
fluree-db-memory = { path = "../fluree-db-memory" }

# Embedded docs lookup (human `fluree docs` CLI subcommand)
fluree-db-docs = { path = "../fluree-db-docs" }

# Unified MCP service (stdio) — selectable memory/docs toolsets
fluree-db-mcp = { path = "../fluree-db-mcp" }

# Server embedding (optional — enables `fluree server` subcommands)
fluree-db-server = { path = "../fluree-db-server", optional = true }

clap = { workspace = true }
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true

toml = "0.8"
toml_edit = "0.22"
comfy-table = "7"
colored = "2"
clap_complete = "4"
indicatif = "0.17"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Unix process management (server subcommand)
libc = "0.2"

# OpenTelemetry (optional, enabled by `otel` feature)
tracing-opentelemetry = { version = "0.32.1", optional = true }
opentelemetry = { version = "0.31.0", optional = true }
opentelemetry-otlp = { version = "0.31.0", optional = true, features = [
    "grpc-tonic",
    "http-proto",
] }
opentelemetry_sdk = { version = "0.31.0", optional = true, features = [
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }

# Token command dependencies
fluree-db-credential = { path = "../fluree-db-credential" }
base64 = "0.22"
bs58 = "0.5"
shellexpand = "3"
dirs = "5"
hex.workspace = true
rand.workspace = true
sha2.workspace = true

# Remote ledger client (track mode) + OIDC discovery/exchange
# `stream` enables streaming a .flpack file body to POST /import without
# buffering the whole archive; `tokio-util` io gives ReaderStream for it.
reqwest = { workspace = true, features = ["stream"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes.workspace = true
urlencoding = { workspace = true }
percent-encoding = "2"
open = "5"

# Sync command dependencies
fluree-db-nameservice-sync = { path = "../fluree-db-nameservice-sync" }
async-trait.workspace = true
parking_lot = "0.12"

# Transparent `.gz` / `.zst` input for the `rdf` verbs. Previously dev-only
# (fixture generation); now on the runtime path.
flate2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
# Dev-only, and deliberately so: this binds the SPARQL lexer's copy of the
# IRIREF exclusion set to the three in the light crates (see
# tests/iriref_fourth_copy.rs). fluree-db-cli is the smallest crate that
# already depends on both sides, so the binding costs no production edge.
fluree-db-sparql = { path = "../fluree-db-sparql" }
predicates = "3"
tempfile = "3"

[lints]
workspace = true
