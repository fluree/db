[package]
name = "fluree-db-stats"
description = "Mergeable statistical sketches and column profiles for Fluree DB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Profile `fluree-db-tabular` column batches (lake scans).
tabular = ["dep:fluree-db-tabular"]

[dependencies]
fluree-db-tabular = { path = "../fluree-db-tabular", optional = true }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
rand.workspace = true

[lints]
workspace = true
