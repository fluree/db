[package]
name = "fluree-sql-bridge"
version = "4.1.6"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/fluree/db"
description = "Trino-protocol HTTP front for a single Postgres, MySQL or SQLite database — a sidecar for Fluree SQL graph sources"
publish = false

# Standalone package, deliberately outside the repo workspace: it links sqlx
# and three database drivers, none of which belong in the `fluree` binary. It
# has its own Cargo.lock.
[workspace]

# Mirrors `[workspace.lints.clippy]` in the repo root, which this package cannot
# inherit across the workspace boundary. The root is the source of truth; keep
# the two in step.
[workspace.lints.clippy]
bool_to_int_with_if = "deny"
comparison_chain = "deny"
elidable_lifetime_names = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
ignored_unit_patterns = "deny"
inconsistent_struct_constructor = "deny"
manual_assert = "deny"
manual_is_variant_and = "deny"
manual_midpoint = "deny"
manual_string_new = "deny"
needless_raw_string_hashes = "deny"
option_as_ref_cloned = "deny"
range_plus_one = "deny"
redundant_closure_for_method_calls = "deny"
redundant_else = "deny"
ref_binding_to_reference = "deny"
semicolon_if_nothing_returned = "deny"
unnecessary_literal_bound = "deny"
unnecessary_semicolon = "deny"
unnested_or_patterns = "deny"
unreadable_literal = "deny"
uninlined_format_args = "deny"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "bigdecimal",
    "json",
    "uuid",
] }
bigdecimal = "0.4"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"

[lints]
workspace = true
