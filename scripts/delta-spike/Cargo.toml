[package]
name = "fluree-delta-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone experiment: does not change Fluree's production dependency graph.
[workspace]
resolver = "2"
exclude = [".patched/object_store-0.13.2"]

# Experimental, reproducible compatibility backport; prepare_storage.py verifies
# the published archive and applies the tracked patch. Not a root patch.
[patch.crates-io]
object_store = { path = ".patched/object_store-0.13.2" }

[features]
bundled-roots = ["object_store/tls-webpki-roots"]

[dependencies]
fluree-db-tabular = { path = "../../fluree-db-tabular" }
delta_kernel = { version = "=0.28.0", features = ["arrow-58"] }
delta_kernel_default_engine = { version = "=0.28.0", default-features = false, features = ["arrow-58", "rustls"] }
object_store = { version = "=0.13.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
flate2 = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# Enable decompression elsewhere in the graph to verify object reads still
# preserve encoded bytes and byte-range semantics.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls = "0.26"

[profile.dev]
debug = 0

[profile.release]
lto = true
strip = true
codegen-units = 1
