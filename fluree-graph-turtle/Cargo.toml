[package]
name = "fluree-graph-turtle"
description = "Turtle (TTL) parser for Fluree graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fluree-graph-ir = { path = "../fluree-graph-ir" }
# For the shared Turtle character-class predicates (`lex::chars`), so the
# parser and the writers cannot drift on what the grammar admits.
fluree-graph-format = { path = "../fluree-graph-format" }
fluree-vocab = { path = "../fluree-vocab" }
winnow = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rustc-hash = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
